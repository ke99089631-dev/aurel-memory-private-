<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>壁→壁 ライブチャート（金M5）</title>
<style>
  html,body{margin:0;height:100%;background:#0d1117;color:#c9d1d9;
    font-family:-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow:hidden}
  #hd{position:fixed;top:0;left:0;right:0;z-index:5;padding:6px 10px;font-size:12px;line-height:1.4;
    background:rgba(13,17,23,.85);border-bottom:1px solid #21262d;backdrop-filter:blur(4px)}
  #hd b{color:#e6edf3}
  #badge{float:right;font-size:11px;padding:1px 8px;border-radius:10px}
  #sub{color:#8b949e;font-size:11px}
  #chart{position:fixed;top:44px;left:0;right:0;bottom:0}
  .tag{display:inline-block;padding:0 6px;border-radius:8px;font-size:10px;margin-right:3px}
  .yel{background:#3a3410;color:#e3c94a}.blu{background:#0e2740;color:#58a6ff}
  .grn{background:#0f2b17;color:#56d364}.red{background:#3a1113;color:#f85149}
  #err{position:fixed;bottom:6px;left:10px;font-size:11px;color:#f85149;z-index:6}
</style></head><body>
<div id="hd">
  <span id="badge"></span>
  <b id="sym">XAUUSD 金 M5</b> <span id="px"></span><br>
  <span id="sub">
    <span class="tag yel">黄=箱上下壁</span><span class="tag blu">青=中間</span>
    <span class="tag grn">緑=TP</span><span class="tag red">赤=SL</span>
    <span id="wallinfo"></span>
  </span>
</div>
<div id="chart"></div>
<div id="err"></div>
<script src="/lightweight-charts.js"></script>
<script>
const LWC = window.LightweightCharts;
const JST = 9*3600;                       // epoch(UTC秒)→JST表示用オフセット
function jstLabel(t, withDate){
  const d = new Date((t + JST)*1000);
  const hh = String(d.getUTCHours()).padStart(2,'0');
  const mm = String(d.getUTCMinutes()).padStart(2,'0');
  if (withDate){ return (d.getUTCMonth()+1)+'/'+d.getUTCDate()+' '+hh+':'+mm; }
  return hh+':'+mm;
}
const chart = LWC.createChart(document.getElementById('chart'), {
  autoSize:true,
  layout:{ background:{color:'#0d1117'}, textColor:'#c9d1d9' },
  grid:{ vertLines:{color:'#2b3440', style:LWC.LineStyle.Solid},
         horzLines:{color:'#2b3440', style:LWC.LineStyle.Solid} },
  crosshair:{ mode: LWC.CrosshairMode.Normal },
  rightPriceScale:{ borderColor:'#30363d' },
  timeScale:{ borderColor:'#30363d', timeVisible:true, secondsVisible:false,
    rightOffset:6, barSpacing:9, minBarSpacing:2,
    tickMarkFormatter:(t)=>jstLabel(t,false) },
  localization:{ timeFormatter:(t)=>jstLabel(t,true), priceFormatter:(p)=>p.toFixed(2) },
});
const series = chart.addCandlestickSeries({
  upColor:'#26a641', downColor:'#f85149', borderUpColor:'#26a641',
  borderDownColor:'#f85149', wickUpColor:'#26a641', wickDownColor:'#f85149',
  priceFormat:{ type:'price', precision:2, minMove:0.01 },
});

let lastTime = 0;         // 既知の最終バー時刻
let wallLines = [];       // 壁/TP/SL（10秒ごと更新）
let curLine = null;       // 現在価格ライン（毎秒 applyOptions で追従）
let firstLoad = true;

function setBadge(live){
  const badge = document.getElementById('badge');
  badge.textContent = live ? '● LIVE' : '○ 履歴';
  badge.style.cssText = 'float:right;font-size:11px;padding:1px 8px;border-radius:10px;'+
    (live?'background:#0f2b17;color:#56d364':'background:#2a2a2a;color:#999');
}
function setWallLines(box, brk){
  for (const pl of wallLines) series.removePriceLine(pl);
  wallLines = [];
  const add = (price,color,style,title)=>{ if(price==null) return;
    wallLines.push(series.createPriceLine({ price, color, lineWidth:1,
      lineStyle:style, axisLabelVisible:true, title })); };
  if (box){
    add(box.up,'#e3c94a',LWC.LineStyle.Dashed,'上壁');
    add(box.dn,'#e3c94a',LWC.LineStyle.Dashed,'下壁');
    add(box.mid,'#58a6ff',LWC.LineStyle.Dotted,'中間');
  }
  if (brk){
    add(brk.tp,'#56d364',LWC.LineStyle.Dashed,'TP');
    add(brk.sl,'#f85149',LWC.LineStyle.Dotted,'SL');
  }
}
function setCurrent(nowPx){
  if (nowPx==null) return;
  if (curLine==null){
    curLine = series.createPriceLine({ price:nowPx, color:'#ffffff',
      lineWidth:1, lineStyle:LWC.LineStyle.Solid, axisLabelVisible:true, title:'現在' });
  } else {
    curLine.applyOptions({ price:nowPx });
  }
}

// フル更新（バー全体＋壁）: 初回とその後10秒ごと
async function pollData(){
  try{
    const r = await fetch('/api/data?n=1500', {cache:'no-store'});
    const d = await r.json();
    document.getElementById('err').textContent = '';
    const bars = d.bars || [];
    if (firstLoad){ series.setData(bars); chart.timeScale().fitContent(); firstLoad=false; }
    else { for (const b of bars){ if (b.time >= lastTime) series.update(b); } }
    if (bars.length) lastTime = bars[bars.length-1].time;
    setWallLines(d.box, d.break);
    setBadge(d.source==='live');
    let wi = '';
    if (d.box) wi += ' ｜ 箱幅'+d.box.width.toFixed(1);
    if (d.break) wi += ' ｜ 直近ブレイク'+(d.break.dir==='UP'?'上':'下')+' 壁'+d.break.wall.toFixed(1)
      +'→TP'+d.break.tp.toFixed(1)+'/SL'+d.break.sl.toFixed(1);
    document.getElementById('wallinfo').textContent = wi;
  }catch(e){ document.getElementById('err').textContent = '接続待ち… '+(e&&e.message?e.message:e); }
}

// 常時追従（軽量）: 毎秒 現在値＋形成中ローソクだけ更新（パン/ズームは壊さない）
async function pollTick(){
  try{
    const r = await fetch('/api/tick', {cache:'no-store'});
    const d = await r.json();
    for (const b of (d.lastbars||[])){ if (b.time >= lastTime) series.update(b); }
    if (d.lastbars && d.lastbars.length) lastTime = Math.max(lastTime, d.lastbars[d.lastbars.length-1].time);
    const tick = d.tick, nowPx = tick ? (tick.bid+tick.ask)/2 : null;
    setCurrent(nowPx);
    setBadge(d.source==='live');
    document.getElementById('px').textContent = tick
      ? ('  '+nowPx.toFixed(2)+'  (spread '+tick.spread_bps.toFixed(2)+'bps)') : '';
  }catch(e){ /* 毎秒なので一時失敗は無視（次の tick で復帰） */ }
}

pollData();
setInterval(pollData, 10000);     // フルは10秒ごと（壁の再計算・取りこぼし補正）
setInterval(pollTick, 1000);      // 現在値は毎秒＝常に追ってる状態
</script></body></html>

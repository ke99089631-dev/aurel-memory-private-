<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>壁→壁 ライブチャート（金M5）</title>
<style>
  html,body{margin:0;height:100%;background:#0d1117;color:#c9d1d9;
    font-family:-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow:hidden}
  #hd{position:fixed;top:0;left:0;right:0;z-index:5;padding:6px 10px;font-size:12px;line-height:1.4;
    background:rgba(13,17,23,.85);border-bottom:1px solid #21262d;backdrop-filter:blur(4px)}
  #hd b{color:#e6edf3}
  #badge{float:right;font-size:11px;padding:1px 8px;border-radius:10px}
  #sub{color:#8b949e;font-size:11px}
  #chart{position:fixed;top:44px;left:0;right:0;bottom:38px}
  #zones{position:fixed;top:44px;left:0;right:0;bottom:38px;pointer-events:none;z-index:1}
  #fixgrid{position:fixed;top:44px;left:0;right:0;bottom:38px;pointer-events:none;z-index:2}
  #trades{position:fixed;top:44px;left:0;right:0;bottom:38px;pointer-events:none;z-index:3}
  #ai{position:fixed;top:44px;left:0;right:0;bottom:38px;pointer-events:none;z-index:4}
  #ctrl{position:fixed;left:0;right:0;bottom:0;height:38px;z-index:6;display:flex;
    align-items:center;gap:4px;padding:0 8px;background:rgba(13,17,23,.92);
    border-top:1px solid #21262d;font-size:12px;overflow-x:auto;white-space:nowrap}
  .cbtn{background:#1b2230;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;
    padding:4px 9px;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .cbtn:active{background:#2a3446}
  .cbtn.on{background:#0f2b17;color:#56d364;border-color:#238636}
  #ctrl .lab{color:#8b949e;font-size:11px}
  #linebar{position:fixed;left:0;right:0;bottom:38px;height:36px;z-index:8;display:none;
    align-items:center;gap:5px;padding:0 8px;background:rgba(13,17,23,.96);
    border-top:1px solid #30363d;overflow-x:auto;white-space:nowrap;font-size:12px}
  #linebar.on{display:flex}
  #lbInfo{color:#c9d1d9;font-size:11px;min-width:64px}
  .sw{display:inline-block;width:20px;height:20px;border-radius:4px;margin:0 1px;cursor:pointer;
    border:2px solid transparent;vertical-align:middle}
  .sw.sel{border-color:#fff}
  #aipnl{position:fixed;top:47px;left:6px;right:6px;z-index:5;display:none;
    background:rgba(13,17,23,.9);border:1px solid #30363d;border-radius:8px;
    padding:5px 9px;font-size:12px;color:#e6edf3;line-height:1.45}
  #aipnl b{color:#fff}
  #tradeInfo,#stats,#paper{position:fixed;top:48px;left:8px;right:8px;z-index:7;display:none;
    background:rgba(20,26,36,.96);border:1px solid #30363d;border-radius:8px;
    padding:7px 10px;font-size:12px;line-height:1.6;color:#e6edf3;max-height:70vh;overflow-y:auto}
  #tradeInfo b,#stats b,#paper b{color:#fff}
  #tradeInfo .x,#stats .x,#paper .x{float:right;color:#8b949e;cursor:pointer;padding:0 4px}
  .chip{background:#1b2230;border:1px solid #30363d;border-radius:12px;padding:3px 9px;
    font-size:12px;cursor:pointer;margin-left:4px;white-space:nowrap;color:#c9d1d9}
  .chip .d{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .tag{display:inline-block;padding:0 6px;border-radius:8px;font-size:10px;margin-right:3px}
  .yel{background:#3a3410;color:#e3c94a}.blu{background:#0e2740;color:#58a6ff}
  .grn{background:#0f2b17;color:#56d364}.red{background:#3a1113;color:#f85149}
  #err{position:fixed;bottom:44px;left:10px;font-size:11px;color:#f85149;z-index:6}
</style></head><body>
<div id="hd">
  <span id="badge"></span>
  <b id="sym">XAUUSD 金 M5</b> <span id="px"></span><br>
  <span id="sub">
    <span class="tag yel">黄=箱上下壁</span><span class="tag blu">青=中間</span>
    <span class="tag grn">緑=TP</span><span class="tag red">赤=SL</span>
    <span id="wallinfo"></span>
  </span>
</div>
<div id="chart"></div>
<canvas id="zones"></canvas>
<canvas id="fixgrid"></canvas>
<canvas id="trades"></canvas>
<canvas id="ai"></canvas>
<div id="ctrl">
  <button class="cbtn" id="addLine" title="水平線を追加">＋線</button>
  <span class="lab">マス</span>
  <button class="cbtn" id="cellDn">−</button>
  <button class="cbtn" id="cellUp">＋</button>
  <button class="cbtn" id="fit" title="全体表示に戻す">⤢ 全体</button>
  <button class="cbtn on" id="zonesBtn" title="時間帯シェード(本物帯/ダマシ巣)">時間帯</button>
  <button class="cbtn" id="statsBtn" title="溜まり幅・壁までの余地">📊 情報</button>
  <button class="cbtn" id="paperBtn" title="AIのセットアップ記録（集計・会長トレードとの紐付け）">🤖 AI</button>
</div>
<div id="linebar">
  <span id="lbInfo">線</span>
  <span id="swatches"></span>
  <span class="lab" style="margin-left:4px">太</span>
  <button class="cbtn" id="wDn">−</button><button class="cbtn" id="wUp">＋</button>
  <button class="cbtn" id="delLine" style="color:#f85149">削除</button>
  <button class="cbtn on" id="doneLine">確定</button>
</div>
<div id="aipnl"></div>
<div id="stats"></div>
<div id="paper"></div>
<div id="tradeInfo"></div>
<div id="err"></div>
<script src="/lightweight-charts.js"></script>
<script>
const LWC = window.LightweightCharts;
const JST = 9*3600;                       // epoch(UTC秒)→JST表示用オフセット
function jstLabel(t, withDate){
  const d = new Date((t + JST)*1000);
  const hh = String(d.getUTCHours()).padStart(2,'0');
  const mm = String(d.getUTCMinutes()).padStart(2,'0');
  if (withDate){ return (d.getUTCMonth()+1)+'/'+d.getUTCDate()+' '+hh+':'+mm; }
  return hh+':'+mm;
}
const chart = LWC.createChart(document.getElementById('chart'), {
  autoSize:true,
  layout:{ background:{color:'#0d1117'}, textColor:'#c9d1d9' },
  grid:{ vertLines:{visible:false}, horzLines:{visible:false} },   // 標準格子はオフ→固定ピクセルのマスを別途描く
  crosshair:{ mode: LWC.CrosshairMode.Normal },
  rightPriceScale:{ borderColor:'#30363d' },
  // MT5同様: 指ドラッグで縦横に動かす・ピンチ/ホイールでズーム・軸ドラッグでスケール
  handleScroll:{ mouseWheel:true, pressedMouseMove:true, horzTouchDrag:true, vertTouchDrag:true },
  handleScale:{ mouseWheel:true, pinch:true, axisPressedMouseMove:{time:true, price:true} },
  timeScale:{ borderColor:'#30363d', timeVisible:true, secondsVisible:false,
    rightOffset:6, barSpacing:9, minBarSpacing:2,
    tickMarkFormatter:(t)=>jstLabel(t,false) },
  localization:{ timeFormatter:(t)=>jstLabel(t,true), priceFormatter:(p)=>p.toFixed(2) },
});
const series = chart.addCandlestickSeries({
  upColor:'#2f81f7', downColor:'#e6edf3', borderUpColor:'#2f81f7',    // 上昇=青 / 下降=白（会長のMT5に合わせる）
  borderDownColor:'#c9d1d9', wickUpColor:'#2f81f7', wickDownColor:'#c9d1d9',
  priceFormat:{ type:'price', precision:2, minMove:0.01 },
});

let lastTime = 0;         // 既知の最終バー時刻
let allBars = [];         // 直近バー配列（トレード時刻のバー吸着・先端合わせ用）
let wallLines = [];       // 壁/TP/SL（10秒ごと更新）
let statsOn = false, lastBox = null, lastBreak = null, curPx = null;  // B2/B3 情報パネル用
let lastDamashi = null;   // C1 ダマシ確率メーター（時間帯本物率）
let curLine = null;       // 現在価格ライン（毎秒 applyOptions で追従）
let firstLoad = true;

function setBadge(live){
  const badge = document.getElementById('badge');
  badge.textContent = live ? '● LIVE' : '○ 履歴';
  badge.style.cssText = 'float:right;font-size:11px;padding:1px 8px;border-radius:10px;'+
    (live?'background:#0f2b17;color:#56d364':'background:#2a2a2a;color:#999');
}
function setWallLines(box, brk){
  for (const pl of wallLines) series.removePriceLine(pl);
  wallLines = [];
  const add = (price,color,style,title)=>{ if(price==null) return;
    wallLines.push(series.createPriceLine({ price, color, lineWidth:1,
      lineStyle:style, axisLabelVisible:true, title })); };
  if (box){
    add(box.up,'#e3c94a',LWC.LineStyle.Solid,'上壁');    // 壁は実線
    add(box.dn,'#e3c94a',LWC.LineStyle.Solid,'下壁');
    add(box.mid,'#58a6ff',LWC.LineStyle.Solid,'中間');
  }
  if (brk){
    add(brk.tp,'#56d364',LWC.LineStyle.Dashed,'TP');
    add(brk.sl,'#f85149',LWC.LineStyle.Dotted,'SL');
  }
}
function setCurrent(nowPx){
  if (nowPx==null) return;
  if (curLine==null){
    curLine = series.createPriceLine({ price:nowPx, color:'#c9d1d9',
      lineWidth:1, lineStyle:LWC.LineStyle.Dotted, axisLabelVisible:true, title:'現在' });   // 現在価格=点線
  } else {
    curLine.applyOptions({ price:nowPx });
  }
}

// フル更新（バー全体＋壁）: 初回とその後10秒ごと
async function pollData(){
  try{
    const r = await fetch('/api/data?n=1500', {cache:'no-store'});
    const d = await r.json();
    document.getElementById('err').textContent = '';
    const bars = d.bars || [];
    if (firstLoad){ series.setData(bars); chart.timeScale().fitContent(); firstLoad=false; }
    else { for (const b of bars){ if (b.time >= lastTime) series.update(b); } }
    if (bars.length){ lastTime = bars[bars.length-1].time; allBars = bars; }
    setWallLines(d.box, d.break);
    lastBox = d.box; lastBreak = d.break; lastDamashi = d.damashi;   // B2/B3/C1 用に保持
    setBadge(d.source==='live');
    let wi = '';
    if (d.box) wi += ' ｜ 箱幅'+d.box.width.toFixed(1);
    if (d.break) wi += ' ｜ 直近ブレイク'+(d.break.dir==='UP'?'上':'下')+' 壁'+d.break.wall.toFixed(1)
      +'→TP'+d.break.tp.toFixed(1)+'/SL'+d.break.sl.toFixed(1);
    document.getElementById('wallinfo').textContent = wi;
    aiPos = d.ai_pos || null; updateAiPnl();   // AURELの建玉（見出し）
    fetchSetups();   // AURELのセットアップ記録（MT5式オーバーレイ）
    fetchTrades();   // 会長の過去トレード（既定オフ）
  }catch(e){ document.getElementById('err').textContent = '接続待ち… '+(e&&e.message?e.message:e); }
}

// 常時追従（軽量）: 毎秒 現在値＋形成中ローソクだけ更新（パン/ズームは壊さない）
async function pollTick(){
  try{
    const r = await fetch('/api/tick', {cache:'no-store'});
    const d = await r.json();
    for (const b of (d.lastbars||[])){ if (b.time >= lastTime) series.update(b); }
    if (d.lastbars && d.lastbars.length) lastTime = Math.max(lastTime, d.lastbars[d.lastbars.length-1].time);
    const tick = d.tick, nowPx = tick ? (tick.bid+tick.ask)/2 : null;
    setCurrent(nowPx);
    curPx = nowPx; updateStats(); updateAiPnl();   // 毎秒: AI建玉の損益も追う
    setBadge(d.source==='live');
    document.getElementById('px').textContent = tick
      ? ('  '+nowPx.toFixed(2)+'  (spread '+tick.spread_bps.toFixed(2)+'bps)') : '';
  }catch(e){ /* 毎秒なので一時失敗は無視（次の tick で復帰） */ }
}

// ── B2 溜まり幅メーター ＋ B3 次壁までの余地ゲージ（常時読める情報パネル）──
function fmtSigned(v){ return (v>=0?'+':'')+v.toFixed(1); }
function updateStats(){
  const el=document.getElementById('stats'); if(!el) return;
  if(!statsOn){ el.style.display='none'; return; }
  if(curPx==null||!lastBox){ el.innerHTML='データ待ち…'; el.style.display='block'; return; }
  const b=lastBox, up=b.up-curPx, dn=curPx-b.dn;
  const near=Math.min(Math.abs(up),Math.abs(dn)), warn = near<=b.width*0.10;
  let h='<span class="x" id="stX">✕</span>';
  h+='<b>現在 '+curPx.toFixed(2)+'</b><br>';
  h+='箱: 上'+b.up.toFixed(1)+' / 中'+b.mid.toFixed(1)+' / 下'+b.dn.toFixed(1)
     +' ・ 溜まり幅 <b>'+b.width.toFixed(1)+'</b><br>';
  h+='余地: 上壁まで <b>'+fmtSigned(up)+'</b> ／ 下壁まで <b>'+fmtSigned(-dn)+'</b>'
     +(warn?' <span style="color:#f0a35e">← 壁に接近</span>':'')+'<br>';
  const k=lastBreak;
  if(k){
    const tpRem=Math.abs(k.tp-curPx), rr=Math.abs(k.tp-k.wall)/Math.max(1e-9,Math.abs(k.wall-k.sl));
    const prog=(curPx-k.wall)/((k.tp-k.wall)||1)*100;
    h+='直近ブレイク: '+(k.dir==='UP'?'上▲':'下▼')+' 壁'+k.wall.toFixed(1)+' 幅'+k.width.toFixed(1)
      +' → TP'+k.tp.toFixed(1)+'（残り<b>'+tpRem.toFixed(1)+'</b>）／ SL'+k.sl.toFixed(1)
      +' ・ RR≈'+rr.toFixed(1)
      +'<br>メジャードムーブ達成 <b>'+Math.max(0,Math.min(100,prog)).toFixed(0)+'%</b>';
  } else { h+='直近ブレイク: なし（レンジ内）'; }
  // C1 ダマシ確率メーター（時間帯本物率）
  const dm=lastDamashi;
  if(dm){
    const rr=dm.real_rate, base=dm.base;
    const col = rr>=base+3?'#56d364' : (rr<=base-3?'#f85149':'#e3c94a');
    const bar = '█'.repeat(Math.round(rr/5)) ;
    h+='<br><span style="color:'+col+'">本物率(JST'+dm.jst_hour+'時) <b>'+rr.toFixed(0)+'%</b></span>'
      +' <span style="color:#8b949e">(平均'+base.toFixed(0)+'% / 機械n='+dm.n+')</span>'
      +'<br><span style="color:'+col+';letter-spacing:-1px">'+bar+'</span>'
      +(rr<=base-3?' <span style="color:#f85149">ダマシ多め</span>':'')
      +(rr>=base+3?' <span style="color:#56d364">本物寄り</span>':'');
  }
  el.innerHTML=h; el.style.display='block';
  const x=document.getElementById('stX'); if(x) x.onclick=()=>{ statsOn=false;
    el.style.display='none'; document.getElementById('statsBtn').classList.remove('on'); };
}
document.getElementById('statsBtn').onclick=(e)=>{ statsOn=!statsOn;
  e.currentTarget.classList.toggle('on',statsOn); updateStats(); };

// ── 収束ループ: AURELのセットアップ記録（/api/setups）。チャートにMT5式で乗せ、集計は短く。──
let setups=[], setupSummary=null, paperOn=false;
async function fetchSetups(){
  try{ const r=await fetch('/api/setups',{cache:'no-store'}); const d=await r.json();
       setups=d.setups||[]; setupSummary=d.summary||null; drawSetups(); updateAiPnl(); if(paperOn) updatePaper(); }catch(e){}
}
function fmtR(v){ return (v>=0?'+':'')+Number(v).toFixed(2)+'R'; }
function updatePaper(){
  const el=document.getElementById('paper'); if(!el) return;
  if(!paperOn){ el.style.display='none'; return; }
  el.style.display='block';
  const s=setupSummary;
  let h='<span class="x" id="pX">✕</span>';
  if(!s||!s.n_setups){ h+='🤖 AI: まだ記録なし（2分ごとに貯まる）'; }
  else{
    const a=s.all||{n:0}, rc=(a.avg_r>=0)?'#56d364':'#f85149';
    h+='<b>🤖 AIのセットアップ記録</b> <span style="color:#8b949e">（紙・発注なし・会長の実とは別）</span><br>';
    h+='決着 <b>'+s.n_closed+'</b>本（建玉中'+(s.status.open||0)+'・戻りなし'+(s.status.no_retest||0)+'・失敗'+(s.status.invalid||0)+'）<br>';
    if(a.n){
      h+='本物率 実測 <b>'+a.tp_rate+'%</b> ／ AI事前予測 '+(a.pred_rate!=null?a.pred_rate+'%':'-')
        +' ／ 平均R <b style="color:'+rc+'">'+fmtR(a.avg_r)+'</b><br>';
      const g=(x,lab)=>x&&x.n?('　'+lab+' n'+x.n+' 本物率'+x.tp_rate+'% '+fmtR(x.avg_r)+'<br>'):'';
      h+=g(s.outer,'外壁(黄)')+g(s.mid,'中間(青)');
      h+=g(s.chase,'即追い変種');
      const zc={'本物帯':'#56d364','ダマシ巣':'#f85149','中立':'#e3c94a'};
      for(const z of ['本物帯','中立','ダマシ巣']){ const v=s.by_zone&&s.by_zone[z]; if(!v||!v.n) continue;
        h+='　<span style="color:'+zc[z]+'">'+z+'</span> n'+v.n+' 本物率'+v.tp_rate+'% '+fmtR(v.avg_r)+'<br>'; }
    }
    h+='会長の実トレードと紐付け <b>'+s.linked+'</b>本（評価一致 '+s.agree+'）<br>';
    h+='<span style="color:#f0a35e">信頼度 '+s.confidence+'</span><br>';
    const last=setups.filter(x=>x.status==='closed'||x.status==='open').slice(-5).reverse();
    if(last.length){ h+='<span style="color:#8b949e">直近:</span><br>';
      for(const t of last){ const c=t.exit_reason==='TP'?'#56d364':(t.exit_reason==='SL'?'#f85149':'#8b949e');
        const res=t.status==='open'?('建玉中 '+(t.live_r!=null?fmtR(t.live_r):'')):(t.outcome||'')+' '+(t.R!=null?fmtR(t.R):'');
        h+='　'+t.id+' '+(t.side==='BUY'?'買':'売')+(t.wall_kind==='mid'?'(青)':'(黄)')
          +' <span style="color:'+c+'">'+res+'</span> <span style="color:#8b949e">'+(t.entry_jst||t.break_jst||'')
          +(t.chairman?' ⇔ '+t.chairman.id:'')+'</span><br>'; } }
    h+='<span style="color:#8b949e;font-size:11px">※gross・スプレッド未控除。TP=溜まり幅1個(壁↔中間)、SL=壁の内側。</span>';
  }
  el.innerHTML=h;
  const x=document.getElementById('pX'); if(x) x.onclick=()=>{ paperOn=false; el.style.display='none';
    document.getElementById('paperBtn').classList.remove('on'); };
}
document.getElementById('paperBtn').onclick=(e)=>{ paperOn=!paperOn;
  e.currentTarget.classList.toggle('on',paperOn); updatePaper(); };

pollData();
setInterval(pollData, 10000);     // フルは10秒ごと（壁の再計算・取りこぼし補正）
setInterval(pollTick, 1000);      // 現在値は毎秒＝常に追ってる状態

const DPR = Math.max(1, window.devicePixelRatio||1);
const chartEl = document.getElementById('chart');

// ── 固定ピクセルのマス（MT5式）: マスは画面に固定＝何を動かしても動かない/大きさ不変。
//    チャートを縦(価格軸ドラッグ)・横に伸縮させ、壁線をこの固定マスに合わせてマス数を数える。──
const fixCanvas=document.getElementById('fixgrid'), fgctx=fixCanvas.getContext('2d');
let cellPx=42;                       // マスの1辺(画面px・固定)。「マス −/＋」でだけ変わる
function drawFixedGrid(){
  const w=chartEl.clientWidth, h=chartEl.clientHeight;
  if(fixCanvas.width!==Math.round(w*DPR)||fixCanvas.height!==Math.round(h*DPR)){
    fixCanvas.width=Math.round(w*DPR); fixCanvas.height=Math.round(h*DPR);
  }
  fgctx.setTransform(DPR,0,0,DPR,0,0); fgctx.clearRect(0,0,w,h);
  fgctx.strokeStyle='rgba(140,160,190,0.15)'; fgctx.lineWidth=1;
  for(let y=0;y<=h;y+=cellPx){ fgctx.beginPath(); fgctx.moveTo(0,Math.round(y)+0.5); fgctx.lineTo(w,Math.round(y)+0.5); fgctx.stroke(); }
  for(let x=0;x<=w;x+=cellPx){ fgctx.beginPath(); fgctx.moveTo(Math.round(x)+0.5,0); fgctx.lineTo(Math.round(x)+0.5,h); fgctx.stroke(); }
}
document.getElementById('cellUp').onclick=()=>{ cellPx=Math.min(120,cellPx+6); drawFixedGrid(); };
document.getElementById('cellDn').onclick=()=>{ cellPx=Math.max(16,cellPx-6); drawFixedGrid(); };
drawFixedGrid();

// ── A2: JST時間帯シェード（本物帯07-12=緑 / ダマシ巣00-05=赤）──
const zonesCanvas = document.getElementById('zones');
const zctx = zonesCanvas.getContext('2d');
let showZones = true;
function zoneOf(t){ const jh=Math.floor(((t+JST)%86400)/3600);
  if(jh>=7&&jh<12) return 'real'; if(jh>=0&&jh<5) return 'trap'; return null; }
function drawZones(){
  const w=chartEl.clientWidth, h=chartEl.clientHeight;
  if(zonesCanvas.width!==Math.round(w*DPR)||zonesCanvas.height!==Math.round(h*DPR)){
    zonesCanvas.width=Math.round(w*DPR); zonesCanvas.height=Math.round(h*DPR);
  }
  zctx.setTransform(DPR,0,0,DPR,0,0); zctx.clearRect(0,0,w,h);
  if(!showZones||!allBars.length) return;
  const tsc=chart.timeScale(); const sp=(tsc.options().barSpacing||8);
  // 表示中のバーだけを見る（全1500本を毎回計算しない＝パンを重くしない）
  const lr=tsc.getVisibleLogicalRange();
  let i0=0, i1=allBars.length-1;
  if(lr){ i0=Math.max(0,Math.floor(lr.from)-1); i1=Math.min(allBars.length-1,Math.ceil(lr.to)+1); }
  let runZone=null, runStartX=null, prevX=null;
  const flush=(endX)=>{ if(runZone&&runStartX!=null&&endX!=null){
    zctx.fillStyle = runZone==='real'?'rgba(38,166,65,0.09)':'rgba(248,81,73,0.09)';
    zctx.fillRect(runStartX,0,Math.max(1,endX-runStartX),h); } };
  for(let i=i0;i<=i1;i++){
    const b=allBars[i]; const x=tsc.timeToCoordinate(b.time);
    if(x==null){ if(runZone){ flush(prevX!=null?prevX+sp/2:null); runZone=null; } continue; }
    const z=zoneOf(b.time);
    if(z!==runZone){ flush(prevX!=null?prevX+sp/2:null); runZone=z; runStartX=x-sp/2; }
    prevX=x;
  }
  flush(prevX!=null?prevX+sp/2:null);
}
document.getElementById('zonesBtn').onclick=(e)=>{ showZones=!showZones;
  e.currentTarget.classList.toggle('on',showZones); redrawOverlays(); };

// ── AURELの建玉を MT5式に重ねる: 建値線＋SL赤帯＋TP緑帯を「入った所から出た所まで」だけ、薄く。建玉中は濃く。──
const aiCanvas=document.getElementById('ai'), aictx=aiCanvas.getContext('2d');
let aiPos=null;              // /api/data の ai_pos（建玉中の見出し用）
function drawSetups(){
  const w=chartEl.clientWidth, h=chartEl.clientHeight;
  if(aiCanvas.width!==Math.round(w*DPR)||aiCanvas.height!==Math.round(h*DPR)){
    aiCanvas.width=Math.round(w*DPR); aiCanvas.height=Math.round(h*DPR);
  }
  aictx.setTransform(DPR,0,0,DPR,0,0); aictx.clearRect(0,0,w,h);
  if(!showPaper||!setups.length||!allBars.length) return;
  const tsc=chart.timeScale();
  const lr=tsc.getVisibleLogicalRange();
  const tFrom = lr ? (allBars[Math.max(0,Math.floor(lr.from))]||allBars[0]).time - 300 : 0;
  const tTo   = lr ? (allBars[Math.min(allBars.length-1,Math.ceil(lr.to))]||allBars[allBars.length-1]).time + 300 : 1e12;
  for(const s of setups){
    if(!(s.status==='open'||s.status==='closed') || s.entry==null || s.entry_time==null) continue;
    const et=nearestBarTime(s.entry_time); if(et==null) continue;
    const xt = s.exit_time!=null ? nearestBarTime(s.exit_time) : null;
    const endT = xt!=null ? xt : allBars[allBars.length-1].time;
    if(endT < tFrom || et > tTo) continue;                       // 画面外
    const x1=tsc.timeToCoordinate(et); if(x1==null) continue;
    let x2 = xt!=null ? tsc.timeToCoordinate(xt) : w;
    if(x2==null) x2=w;
    if(x2 - x1 < 3) x2 = x1 + 3;
    const yE=series.priceToCoordinate(s.entry), ySL=series.priceToCoordinate(s.sl), yTP=series.priceToCoordinate(s.tp);
    if(yE==null||ySL==null||yTP==null) continue;
    const live = s.status==='open';
    // MT5式: 線が主役。帯はごく薄く（建玉中だけ少し濃く）
    const a = live?0.12:0.05;
    aictx.fillStyle='rgba(248,81,73,'+a+')'; aictx.fillRect(x1,Math.min(yE,ySL),x2-x1,Math.abs(ySL-yE));
    aictx.fillStyle='rgba(38,166,65,'+a+')'; aictx.fillRect(x1,Math.min(yE,yTP),x2-x1,Math.abs(yTP-yE));
    const seg=(y,col,dash,lw)=>{ aictx.strokeStyle=col; aictx.lineWidth=lw||1; aictx.setLineDash(dash||[]);
      aictx.beginPath(); aictx.moveTo(x1,y); aictx.lineTo(x2,y); aictx.stroke(); aictx.setLineDash([]); };
    seg(yE,'rgba(88,166,255,'+(live?1:0.75)+')',[],live?2:1.2);                 // 建値＝青実線
    seg(ySL,'rgba(248,81,73,'+(live?0.9:0.45)+')',[3,3]);                         // SL＝赤点線
    seg(yTP,'rgba(86,211,100,'+(live?0.9:0.45)+')',[3,3]);                        // TP＝緑点線
    // 入口: 建値線の左端に小さな▲▼と短いラベル（線に貼り付く）
    const buy = s.side==='BUY';
    aictx.fillStyle = buy?'#58a6ff':'#f0a35e';
    aictx.beginPath();
    if(buy){ aictx.moveTo(x1,yE-1); aictx.lineTo(x1-4,yE+6); aictx.lineTo(x1+4,yE+6); }
    else   { aictx.moveTo(x1,yE+1); aictx.lineTo(x1-4,yE-6); aictx.lineTo(x1+4,yE-6); }
    aictx.closePath(); aictx.fill();
    aictx.font=(live?'bold ':'')+'9px monospace'; aictx.textBaseline='middle'; aictx.textAlign='left';
    aictx.fillStyle='rgba(200,220,255,'+(live?1:0.75)+')';
    aictx.fillText('AI'+(buy?'買':'売')+' '+s.entry.toFixed(1)+(live?' '+s.id:''), x1+6, buy?yE+7:yE-7);
    // 出口: 結果の点＋R（決済価格の位置＝SLかTPの線の上に乗る）
    if(!live && s.exit!=null){
      const yX=series.priceToCoordinate(s.exit); if(yX==null) continue;
      const win = s.exit_reason==='TP';
      aictx.fillStyle = win?'#56d364':(s.exit_reason==='SL'?'#f85149':'#8b949e');
      aictx.beginPath(); aictx.arc(x2,yX,3,0,7); aictx.fill();
      aictx.font='9px monospace'; aictx.fillText(fmtR(s.R||0)+(s.chairman?' ⇔'+s.chairman.id:''), x2+4, yX);
    }
  }
}
// 見出し1行（常時）: 建玉中なら損益、無ければスコープ（本物率・AI実測・信頼度）
function updateAiPnl(){
  const el=document.getElementById('aipnl'); if(!el) return;
  if(!showPaper){ el.style.display='none'; return; }
  el.style.display='block';
  const p=aiPos;
  if(p && p.open){
    const risk=Math.abs(p.entry-p.sl)||1e-9;
    let lr=p.live_r;
    if(curPx!=null){ lr = (p.side==='SELL') ? (p.entry-curPx)/risk : (curPx-p.entry)/risk; }
    const col = lr>=0?'#56d364':'#f85149';
    el.innerHTML='<b>🤖 AI '+(p.side==='BUY'?'買い':'売り')+'</b> @'+p.entry.toFixed(2)
      +' <span style="color:#8b949e">SL'+p.sl.toFixed(2)+' TP'+p.tp.toFixed(2)+'</span>'
      +' ｜ <b style="color:'+col+'">'+(lr>=0?'+':'')+lr.toFixed(2)+'R</b>'
      +' <span style="color:#8b949e;font-size:11px">'+(p.reason||'')+'</span>';
    return;
  }
  const s=setupSummary, dm=lastDamashi, k=lastBreak;
  let h='<b>🎯 AI</b> ';
  if(k){ h+=(k.dir==='UP'?'上':'下')+'ブレイク中 → 戻り目'+k.wall.toFixed(1)+'で入る構え'; }
  else { h+='待機（箱の中）'; }
  if(dm){ const col = dm.real_rate>=dm.base+3?'#56d364':(dm.real_rate<=dm.base-3?'#f85149':'#e3c94a');
    h+=' ｜ 今の時間帯の本物率 <b style="color:'+col+'">'+dm.real_rate.toFixed(0)+'%</b>'; }
  if(s && s.all && s.all.n){ h+=' ｜ AI実測 '+s.all.tp_rate+'%（n'+s.all.n+'・'+fmtR(s.all.avg_r)+'）'; }
  if(s){ h+=' <span style="color:#f0a35e;font-size:11px">信頼度 '+s.confidence.split('（')[0]+'</span>'; }
  el.innerHTML=h;
}

// オーバーレイ(時間帯/トレード/AI建玉)は「表示範囲が変わった時」だけ再描画＝パンを重くしない
function redrawOverlays(){ try{ drawZones(); drawTrades(); drawSetups(); }catch(e){} }
chart.timeScale().subscribeVisibleLogicalRangeChange(redrawOverlays);   // パン/ズームに追従
window.addEventListener('resize', ()=>setTimeout(()=>{ drawFixedGrid(); redrawOverlays(); },60));
setInterval(redrawOverlays, 300);   // 保険(ライブ更新・トグル反映)
// 縦の伸縮（価格軸ドラッグ）にはイベントが無いので、毎フレーム「座標が変わったか」だけ見て変わった時だけ描き直す
// ＝オーバーレイがローソクから遅れて浮いて見えない。判定は座標2点の比較だけなので軽い。
(function(){ let sig='';
  function tick(){
    try{
      const tsc=chart.timeScale(); const lr=tsc.getVisibleLogicalRange();
      const p=(curPx!=null)?curPx:(lastBox?lastBox.mid:null);
      const y=(p!=null)?series.priceToCoordinate(p):null;
      const y2=(lastBox)?series.priceToCoordinate(lastBox.up):null;
      const s=(lr?lr.from.toFixed(2)+'/'+lr.to.toFixed(2):'')+'|'+y+'|'+y2+'|'+chartEl.clientWidth+'x'+chartEl.clientHeight;
      if(s!==sig){ sig=s; redrawOverlays(); }
    }catch(e){}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
redrawOverlays();

// 「全体」ボタン: 自動スケール＋全体表示に戻す
document.getElementById('fit').onclick=()=>{
  chart.priceScale('right').applyOptions({autoScale:true}); chart.timeScale().fitContent(); };

// ── 水平線ツール（多色・太さ・複数・追加/削除・タップで選択→ドラッグ移動。保存でAURELも読める）──
let userLines=[], uLineObjs={}, selLine=null, lineEdit=false;
const COLORS=['#ffffff','#2f81f7','#e3c94a','#f85149','#56d364','#22d3ee','#c084fc','#f0a35e'];
const _sScroll={ mouseWheel:true, pressedMouseMove:true, horzTouchDrag:true, vertTouchDrag:true };
const _sScale={ mouseWheel:true, pinch:true, axisPressedMouseMove:{time:true, price:true} };
function renderUserLines(){
  for(const id in uLineObjs){ series.removePriceLine(uLineObjs[id]); } uLineObjs={};
  for(const L of userLines){ uLineObjs[L.id]=series.createPriceLine({ price:L.price, color:L.color,
    lineWidth:L.width, lineStyle:LWC.LineStyle.Solid, axisLabelVisible:true,
    title:(L.id===selLine?'◆':'') }); }
}
async function loadLines(){ try{ const r=await fetch('/api/lines'); const d=await r.json();
  userLines=(d.lines||[]).map(L=>({id:L.id,price:L.price,color:L.color,width:L.width||2})); renderUserLines(); }catch(e){} }
async function saveLines(){ try{ await fetch('/api/lines',{method:'POST',
  headers:{'Content-Type':'application/json'}, body:JSON.stringify({lines:userLines})}); }catch(e){} }
function curL(){ return userLines.find(L=>L.id===selLine); }
function lbInfo(){ const L=curL(); if(L) document.getElementById('lbInfo').textContent='線 '+L.price.toFixed(2)+' / 太'+L.width; }
function markSwatch(c){ document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('sel',s.dataset.c===c)); }
function buildSwatches(){ const box=document.getElementById('swatches'); box.innerHTML='';
  for(const c of COLORS){ const s=document.createElement('span'); s.className='sw'; s.style.background=c;
    s.dataset.c=c; s.onclick=()=>{ const L=curL(); if(!L)return; L.color=c; renderUserLines(); markSwatch(c); saveLines(); };
    box.appendChild(s); } }
function enterEdit(){ lineEdit=true; chart.applyOptions({handleScroll:false,handleScale:false});
  document.getElementById('linebar').classList.add('on'); const L=curL(); if(L) markSwatch(L.color); lbInfo(); }
function exitEdit(){ lineEdit=false; chart.applyOptions({handleScroll:_sScroll,handleScale:_sScale});
  document.getElementById('linebar').classList.remove('on'); selLine=null; renderUserLines(); }
document.getElementById('addLine').onclick=()=>{
  const price=(curPx!=null)?curPx:(lastBox?lastBox.mid:(series.coordinateToPrice(chartEl.clientHeight/2)||4330));
  const id='L'+Date.now(); userLines.push({id, price:Math.round(price*100)/100, color:'#ffffff', width:2});
  selLine=id; renderUserLines(); saveLines(); enterEdit(); };
document.getElementById('delLine').onclick=()=>{ if(!selLine)return;
  userLines=userLines.filter(L=>L.id!==selLine); saveLines(); exitEdit(); };
document.getElementById('doneLine').onclick=()=>{ saveLines(); exitEdit(); };
document.getElementById('wUp').onclick=()=>{ const L=curL(); if(!L)return; L.width=Math.min(6,L.width+1); renderUserLines(); lbInfo(); saveLines(); };
document.getElementById('wDn').onclick=()=>{ const L=curL(); if(!L)return; L.width=Math.max(1,L.width-1); renderUserLines(); lbInfo(); saveLines(); };
// タップで線を選択→編集（近い線だけ掴む＝勝手に動かない）
chart.subscribeClick((param)=>{ if(lineEdit||!param.point) return;
  let best=null,bd=1e9; for(const L of userLines){ const yb=series.priceToCoordinate(L.price);
    if(yb==null) continue; const d=Math.abs(yb-param.point.y); if(d<bd){bd=d;best=L;} }
  if(best && bd<=12){ selLine=best.id; renderUserLines(); enterEdit(); } });
// 編集中のみ縦ドラッグで移動
(function(){ let drag=false;
  const yToP=(cy)=>{ const r=chartEl.getBoundingClientRect(); return series.coordinateToPrice(cy-r.top); };
  const down=(e)=>{ if(!lineEdit||!selLine) return; drag=true; mv(e); };
  const mv=(e)=>{ if(!drag) return; const y=(e.touches?e.touches[0].clientY:e.clientY);
    const p=yToP(y); const L=curL(); if(p!=null&&L){ L.price=Math.round(p*100)/100; renderUserLines(); lbInfo(); } if(e.cancelable) e.preventDefault(); };
  const up=()=>{ if(drag){ drag=false; saveLines(); } };
  chartEl.addEventListener('touchstart',down,{passive:false});
  chartEl.addEventListener('touchmove',mv,{passive:false});
  chartEl.addEventListener('touchend',up);
  chartEl.addEventListener('mousedown',down); chartEl.addEventListener('mousemove',mv); chartEl.addEventListener('mouseup',up);
})();
buildSwatches(); loadLines();

// ── A3: 自分の過去トレード重ね描き（台帳ledger→E/SL/TP/決済を地図に）──
const tradesCanvas = document.getElementById('trades');
const tctx = tradesCanvas.getContext('2d');
let tradesData = [];
let showTrades = false;      // 会長の過去トレード(B)は既定オフ。今回の主役はAのAI建玉
let showPaper = true;        // AIの建玉オーバーレイ（MT5式・時間区間限定・薄い）は既定オン
function nearestBarTime(t){
  const n=allBars.length; if(!n) return null;
  if(t<=allBars[0].time) return allBars[0].time;
  if(t>=allBars[n-1].time) return allBars[n-1].time;
  let lo=0,hi=n-1;
  while(lo<=hi){ const m=(lo+hi)>>1; const bt=allBars[m].time;
    if(bt===t) return bt; if(bt<t) lo=m+1; else hi=m-1; }
  const a=allBars[Math.max(0,hi)].time, b=allBars[Math.min(n-1,lo)].time;
  return (t-a)<=(b-t)?a:b;
}
function nearestBar(time){
  const bt=nearestBarTime(time); if(bt==null) return null;
  for(const b of allBars){ if(b.time===bt) return b; } return null;
}
function tradeR(t){
  if(t.exit==null||t.sl==null||t.entry==null) return null;
  const risk=Math.abs(t.entry-t.sl); if(!risk) return null;
  const pnl = t.side==='BUY' ? (t.exit-t.entry) : (t.entry-t.exit);
  return pnl/risk;
}
function tradeWin(t){ if(t.exit==null) return null;
  return t.side==='BUY' ? (t.exit>t.entry) : (t.exit<t.entry); }
function focusTrade(t){
  const et=nearestBarTime(t.entry_time);
  let xt = t.exit_time!=null ? nearestBarTime(t.exit_time)
         : (allBars.length?allBars[allBars.length-1].time:et);
  if(et==null) return;
  const pad=25*300;                       // 前後25本(=125分)の余白
  try{ chart.priceScale('right').applyOptions({autoScale:true});
       chart.timeScale().setVisibleRange({from:et-pad, to:(xt||et)+pad}); }catch(e){}
  const R=tradeR(t), win=tradeWin(t);
  const info=document.getElementById('tradeInfo');
  const col = win===null?'#8b949e':(win?'#56d364':'#f85149');
  info.innerHTML='<span class="x" id="tiX">✕</span>'
    +'<b>'+t.id+' '+(t.side==='BUY'?'買い▲':'売り▼')+'</b>'
    +' 建値'+t.entry+' ／ SL'+(t.sl??'-')+' ／ TP'+(t.tp??'-')+'<br>'
    +'決済'+(t.exit!=null?t.exit:'（建玉中）')
    +(t.post?' ・<span style="color:'+col+'">'+t.post+'</span>':'')
    +(R!=null?' <b style="color:'+col+'">'+(R>=0?'+':'')+R.toFixed(2)+'R</b>':'')
    +(t.wall?'<br><span style="color:#8b949e">壁: '+t.wall+'</span>':'');
  info.style.display='block';
  document.getElementById('tiX').onclick=()=>{ info.style.display='none'; };
}
function renderChips(){
  const box=document.getElementById('tradeChips'); if(!box) return;
  box.innerHTML='';
  for(const t of tradesData){
    const win=tradeWin(t);
    const c=document.createElement('span'); c.className='chip';
    const col=win===null?'#8b949e':(win?'#56d364':'#f85149');
    c.innerHTML='<span class="d" style="background:'+col+'"></span>'+t.id+(t.side==='BUY'?' 買':' 売');
    c.onclick=()=>focusTrade(t);
    box.appendChild(c);
  }
}
async function fetchTrades(){
  try{ const r=await fetch('/api/trades',{cache:'no-store'}); const d=await r.json();
       tradesData=d.trades||[]; renderChips(); }catch(e){}
}
function drawTrades(){
  const w=chartEl.clientWidth, h=chartEl.clientHeight;
  if(tradesCanvas.width!==Math.round(w*DPR)||tradesCanvas.height!==Math.round(h*DPR)){
    tradesCanvas.width=Math.round(w*DPR); tradesCanvas.height=Math.round(h*DPR);
  }
  tctx.setTransform(DPR,0,0,DPR,0,0);
  tctx.clearRect(0,0,w,h);
  if(!showTrades) return;
  const tsc=chart.timeScale();
  for(const t of tradesData){
    if(t.entry_time==null || t.entry==null) continue;
    const et=nearestBarTime(t.entry_time); if(et==null) continue;   // トレード時刻→最寄りバーに吸着
    const x1=tsc.timeToCoordinate(et);
    if(x1==null) continue;                                   // 画面外(時間)ならスキップ
    let x2 = w;
    if(t.exit_time!=null){ const xt=nearestBarTime(t.exit_time);
      const cx = xt!=null ? tsc.timeToCoordinate(xt) : null; x2 = cx==null ? w : cx; }
    const yE=series.priceToCoordinate(t.entry);
    const ySL=t.sl!=null?series.priceToCoordinate(t.sl):null;
    const yTP=t.tp!=null?series.priceToCoordinate(t.tp):null;
    const yX=t.exit!=null?series.priceToCoordinate(t.exit):null;
    const seg=(y,color,dash)=>{ if(y==null)return; tctx.strokeStyle=color; tctx.lineWidth=1.4;
      tctx.setLineDash(dash||[]); tctx.beginPath();
      tctx.moveTo(x1,y); tctx.lineTo(Math.max(x1+2,x2),y); tctx.stroke(); tctx.setLineDash([]); };
    seg(ySL,'rgba(248,81,73,0.85)',[3,3]);                   // SL 赤破線
    seg(yTP,'rgba(86,211,100,0.85)',[6,4]);                  // TP 緑破線
    seg(yE,'rgba(235,235,235,0.9)',[]);                      // 建値 白実線
    if(yE!=null){                                            // entryマーカー
      const buy=t.side==='BUY'; tctx.fillStyle=buy?'#26a641':'#f85149';
      tctx.beginPath();
      if(buy){ tctx.moveTo(x1,yE+9); tctx.lineTo(x1-5,yE+18); tctx.lineTo(x1+5,yE+18); }
      else   { tctx.moveTo(x1,yE-9); tctx.lineTo(x1-5,yE-18); tctx.lineTo(x1+5,yE-18); }
      tctx.closePath(); tctx.fill();
      tctx.fillStyle='#c9d1d9'; tctx.font='10px monospace'; tctx.textBaseline='middle';
      tctx.fillText(t.id+' '+(buy?'買':'売'), x1+7, buy?yE+14:yE-14);
    }
    if(yX!=null && t.exit_time!=null){                       // exitマーカー
      const win = t.side==='BUY' ? (t.exit>t.entry) : (t.exit<t.entry);
      tctx.fillStyle = win?'#56d364':'#f85149';
      tctx.beginPath(); tctx.arc(x2,yX,4,0,7); tctx.fill();
      if(t.post){ tctx.fillStyle='#f0a35e'; tctx.font='10px monospace';
        tctx.textBaseline='middle'; tctx.fillText(t.post, x2+6, yX); }
    }
  }
}
fetchTrades();
